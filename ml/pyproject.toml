[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrisense-ml"
version = "0.1.0"
description = "Reproducible food-recognition research pipeline for NutriSense"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4",
  "Pillow==11.1.0",
  "scikit-learn==1.6.1",
  "matplotlib==3.10.0",
  "tensorflow==2.18.0; platform_system != 'Darwin' or platform_machine != 'arm64'",
  "tensorflow-macos==2.16.2; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.9.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
