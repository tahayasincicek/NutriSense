# =============================================================================
# .github/workflows/ci.yml
# NutriSense — CI/CD Pipeline (GitHub Actions)
#
# Her push ve pull request'te:
#   1. Flutter testleri (unit + widget + erişilebilirlik)
#   2. Flutter analiz (lint)
#   3. Backend Python testleri
#   4. Erişilebilirlik denetimi
# =============================================================================

name: NutriSense CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.4"
  PYTHON_VERSION: "3.11"
  ANALYSIS_PYTHON_VERSION: "3.13"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # FLUTTER TESTLERİ
  # ═══════════════════════════════════════════════════════════════════════════

  flutter-test:
    name: Flutter Test & Analiz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: Dart analiz (lint)
        run: flutter analyze --no-fatal-infos

      - name: Dart format kontrolü
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      # ── Unit Testler ──
      - name: Unit testleri çalıştır
        run: |
          flutter test test/unit/ \
            --reporter expanded \
            --coverage

      - name: Mobil API consumer contract testleri
        run: flutter test test/contract/ --reporter expanded

      # ── Widget Testler ──
      - name: Widget testleri çalıştır
        run: |
          flutter test test/widget/ \
            --reporter expanded

      # ── Erişilebilirlik Testleri ──
      - name: Erişilebilirlik testleri çalıştır
        run: |
          flutter test test/accessibility/ \
            --reporter expanded

      # ── Tüm testler (coverage ile) ──
      - name: Tüm testleri çalıştır (coverage)
        run: |
          flutter test --coverage

      # ── Coverage raporu ──
      - name: Coverage raporu oluştur
        if: success()
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "Test coverage dosyası oluşturuldu."
            # lcov --summary coverage/lcov.info
          fi

      # ── Artifact olarak kaydet ──
      - name: Test sonuçlarını kaydet
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-results
          path: coverage/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND TESTLERİ
  # ═══════════════════════════════════════════════════════════════════════════

  backend-test:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install flake8

      - name: Python lint (flake8)
        run: |
          flake8 app/ --count --statistics

      - name: Backend testleri çalıştır
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          JWT_SECRET_KEY: "synthetic-ci-jwt-key-000000000000000000000000"
          APP_ENVIRONMENT: "test"
          DEBUG: "false"
          MIGRATION_CHECK_ENABLED: "false"
        run: |
          python scripts/export_openapi.py --check
          python scripts/security_smoke.py
          python -m pytest -v --tb=short

      - name: Migration boş DB up/down/up kontrolü
        env:
          DATABASE_URL: "sqlite+pysqlite:///${{ runner.temp }}/nutrisense-migration.db"
          JWT_SECRET_KEY: "synthetic-ci-jwt-key-000000000000000000000000"
          APP_ENVIRONMENT: "test"
          DEBUG: "false"
          MIGRATION_CHECK_ENABLED: "false"
        run: |
          alembic upgrade head
          alembic current
          alembic downgrade -1
          alembic upgrade head

  android-integration:
    name: Android P0 Fixture Yolculuğu
    runs-on: ubuntu-latest
    needs: flutter-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: KVM erişimini etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API 35 emulator üzerinde P0 integration testi
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test/p0_fixture_journey_test.dart -d emulator-5554

  ml-validation:
    name: ML Güvenlik ve Yeniden Üretilebilirlik Kapıları
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ml/requirements.lock

      - name: Hafif doğrulama bağımlılıklarını yükle
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.4 numpy==1.26.4 Pillow==11.1.0

      - name: Manifest, split, checksum, OOD ve threshold testleri
        env:
          PYTHONPATH: ml/src
        run: python -m pytest ml/tests -q

      - name: Model yokluğu kanıt durumunu doğrula
        run: |
          python -c "import json, pathlib; p=json.loads(pathlib.Path('ml/runs/NOT_RUN/metrics.json').read_text()); assert p['status']=='not_run'"
          python -c "import pathlib; assert not list(pathlib.Path('ml').rglob('*.tflite')), 'Tracked/generated TFLite must not masquerade as validated evidence'"

  security:
    name: Güvenlik Taramaları
    runs-on: ubuntu-latest

    steps:
      - name: Tam geçmişi checkout et
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Secret taraması (değerler redakte)
        run: python scripts/security/secret_scan.py --history

      - name: Python bağımlılık zafiyet taraması
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.0
          python -m pip_audit \
            --requirement backend/requirements.txt \
            --progress-spinner off

      - name: Production backend imajını oluştur
        run: docker build --target production --tag "nutrisense-backend:${GITHUB_SHA}" backend

      - name: Container zafiyet taraması
        # v0.36.0 signed release commit; tag yerine immutable SHA kullanılır.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "nutrisense-backend:${{ github.sha }}"
          version: "v0.70.0"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  analysis-test:
    name: Açık Bilim Analiz Hattı
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.ANALYSIS_PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: analysis/requirements.lock

      - name: Kilitli analiz ortamını yükle
        run: python -m pip install --requirement analysis/requirements.lock

      - name: Analiz testlerini çalıştır
        env:
          PYTHONPATH: analysis/src
        run: python -m pytest analysis/tests -q

      - name: Gerçek veri yok kapısını doğrula
        run: |
          python analysis/run_analysis.py \
            --mode real \
            --output-root "$RUNNER_TEMP/real-analysis-output"
          python -c "import json, pathlib; p=json.loads((pathlib.Path('$RUNNER_TEMP')/'results_manifest.json').read_text()); assert p['status']=='NO REAL DATA' and not p['results']"

      - name: Sentetik pipeline smoke testi
        run: |
          python analysis/tools/generate_synthetic_fixture.py \
            --output "$RUNNER_TEMP/synthetic-input"
          python analysis/run_analysis.py \
            --mode synthetic \
            --usability "$RUNNER_TEMP/synthetic-input/usability_tidy.synthetic.json" \
            --survey "$RUNNER_TEMP/synthetic-input/survey_tidy.synthetic.json" \
            --output-root "$RUNNER_TEMP/synthetic-analysis-output"
          python -c "import json, pathlib; p=json.loads((pathlib.Path('$RUNNER_TEMP')/'synthetic-analysis-output'/'synthetic'/'LATEST_STATUS.json').read_text()); assert p['status']=='SYNTHETIC_PIPELINE_TEST_ONLY' and p['synthetic']"

  # ═══════════════════════════════════════════════════════════════════════════
  # ERİŞİLEBİLİRLİK DENETİMİ
  # ═══════════════════════════════════════════════════════════════════════════

  accessibility-audit:
    name: Erişilebilirlik Denetimi
    runs-on: ubuntu-latest
    needs: flutter-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: Erişilebilirlik testi
        run: |
          echo "═══ ERİŞİLEBİLİRLİK DENETİMİ ═══"
          flutter test test/accessibility/ --reporter expanded
          echo "✅ Erişilebilirlik denetimi tamamlandı"

  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD KONTROLÜ (sadece main)
  # ═══════════════════════════════════════════════════════════════════════════

  build-check:
    name: Build Kontrolü
    runs-on: ubuntu-latest
    needs: [flutter-test, backend-test, android-integration, ml-validation, analysis-test, security]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: APK build kontrolü
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --no-tree-shake-icons 2>&1 | tee "$RUNNER_TEMP/flutter-build.log"
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Debug APK artefaktını kaydet
        uses: actions/upload-artifact@v7
        with:
          name: nutrisense-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
