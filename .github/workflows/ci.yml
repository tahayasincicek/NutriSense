# =============================================================================
# .github/workflows/ci.yml
# NutriSense — CI/CD Pipeline (GitHub Actions)
#
# Her push ve pull request'te:
#   1. Flutter testleri (unit + widget + erişilebilirlik)
#   2. Flutter analiz (lint)
#   3. Backend Python testleri
#   4. Erişilebilirlik denetimi
# =============================================================================

name: NutriSense CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nutrisense-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.4"
  PYTHON_VERSION: "3.11"
  ANALYSIS_PYTHON_VERSION: "3.13"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # FLUTTER TESTLERİ
  # ═══════════════════════════════════════════════════════════════════════════

  flutter-test:
    name: Flutter Test & Analiz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: Dart analiz (lint)
        run: flutter analyze --no-fatal-infos

      - name: Dart format kontrolü
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      # ── Unit Testler ──
      - name: Unit testleri çalıştır
        run: |
          flutter test test/unit/ \
            --reporter expanded \
            --coverage

      - name: Mobil API consumer contract testleri
        run: flutter test test/contract/ --reporter expanded

      - name: Staging ve production public config TLS kapısı
        run: |
          flutter test test/unit/app_config_test.dart \
            --dart-define=APP_ENV=staging \
            --dart-define=API_BASE_URL=https://staging.invalid/api/v1
          flutter test test/unit/app_config_test.dart \
            --dart-define=APP_ENV=prod \
            --dart-define=API_BASE_URL=https://production.invalid/api/v1

      # ── Widget Testler ──
      - name: Widget testleri çalıştır
        run: |
          flutter test test/widget/ \
            --reporter expanded

      # ── Erişilebilirlik Testleri ──
      - name: Erişilebilirlik testleri çalıştır
        run: |
          flutter test test/accessibility/ \
            --reporter expanded

      # ── Tüm testler (coverage ile) ──
      - name: Tüm testleri çalıştır (coverage)
        run: |
          flutter test --coverage

      # ── Coverage raporu ──
      - name: Coverage raporu oluştur
        if: success()
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "Test coverage dosyası oluşturuldu."
            # lcov --summary coverage/lcov.info
          fi

      # ── Artifact olarak kaydet ──
      - name: Test sonuçlarını kaydet
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-results
          path: coverage/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND TESTLERİ
  # ═══════════════════════════════════════════════════════════════════════════

  backend-test:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Python lint (flake8)
        run: |
          flake8 app/ --count --statistics
          flake8 scripts/ provider_mocks/ tests/test_operations_readiness.py --count --statistics

      - name: Deployment statik güvenlik kapıları
        run: python scripts/deployment_checks.py

      - name: Backend testleri çalıştır
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          JWT_SECRET_KEY: "synthetic-ci-jwt-key-000000000000000000000000"
          APP_ENVIRONMENT: "test"
          DEBUG: "false"
          MIGRATION_CHECK_ENABLED: "false"
        run: |
          python scripts/export_openapi.py --check
          python scripts/security_smoke.py
          python -m pytest -v --tb=short

      - name: Migration boş DB up/down/up kontrolü
        env:
          DATABASE_URL: "sqlite+pysqlite:///${{ runner.temp }}/nutrisense-migration.db"
          JWT_SECRET_KEY: "synthetic-ci-jwt-key-000000000000000000000000"
          APP_ENVIRONMENT: "test"
          DEBUG: "false"
          MIGRATION_CHECK_ENABLED: "false"
        run: |
          alembic upgrade head
          alembic current
          alembic downgrade -1
          alembic upgrade head

  android-integration:
    name: Android P0 Fixture Yolculuğu
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: flutter-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: KVM erişimini etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # APK emülatör açıkken derlenirse Gradle ile QEMU aynı iki çekirdek için
      # yarışıyor ve emülatörün ana döngüsü kilitleniyor. Derlemeyi öne alıp
      # Gradle önbelleğini ısıtmak, emülatör adımındaki işi kısaltır.
      - name: Emülatörden önce APK derle
        run: flutter build apk --debug --flavor dev --dart-define=APP_ENV=dev

      # Derleme çıktısı runner diskini doldurunca emülatör sistem imajı
      # inemiyor ve "No space left on device" ile düşüyor. Gradle önbelleği
      # korunur; yalnız APK çıktısı ve kullanılmayan araç zincirleri silinir.
      - name: Emülatör için disk alanı aç
        run: |
          rm -rf build/app/outputs
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      # Emülatör anlık görüntüden açılırken adb bağlantısı hazır olmadan
      # action'ın kurulum komutları çalışıyor ve "adb: device offline" ile
      # düşüyordu. -no-snapshot bu yarışı ortadan kaldırır.
      - name: API 35 emulator üzerinde P0 integration testi
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          # Animasyon kapatma adimi acilistan hemen sonra adb ile ayar yazar
          # ve "device offline" ile duser. Test pumpAndSettle kullandigi icin
          # animasyonlarin acik kalmasi sonucu etkilemez.
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: flutter test integration_test/p0_fixture_journey_test.dart -d emulator-5554 --flavor dev --dart-define=APP_ENV=dev

  ml-validation:
    name: ML Güvenlik ve Yeniden Üretilebilirlik Kapıları
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ml/requirements.lock

      - name: Hafif doğrulama bağımlılıklarını yükle
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.4 numpy==1.26.4 Pillow==11.1.0

      - name: Manifest, split, checksum, OOD ve threshold testleri
        env:
          PYTHONPATH: ml/src
        run: python -m pytest ml/tests -q

      - name: Model yokluğu kanıt durumunu doğrula
        run: |
          python -c "import json, pathlib; p=json.loads(pathlib.Path('ml/runs/NOT_RUN/metrics.json').read_text()); assert p['status']=='not_run'"
          python -c "import pathlib; assert not list(pathlib.Path('ml').rglob('*.tflite')), 'Tracked/generated TFLite must not masquerade as validated evidence'"

  security:
    name: Güvenlik Taramaları
    runs-on: ubuntu-latest

    steps:
      - name: Tam geçmişi checkout et
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Secret taraması (değerler redakte)
        run: python scripts/security/secret_scan.py --history

      - name: Android release sınırları
        run: python scripts/qa/android_release_checks.py

      # iOS kapısı .flutter-plugins-dependencies dosyasını okur; bu dosya
      # sürüm kontrolüne girmez ve yalnız `flutter pub get` ile üretilir.
      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter bağımlılıklarını çöz
        run: flutter pub get

      - name: iOS kaynak hazırlığı sınırları
        run: python scripts/qa/ios_release_checks.py

      - name: Python bağımlılık zafiyet taraması
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.0
          python -m pip_audit \
            --requirement backend/requirements.lock \
            --progress-spinner off

      - name: Production backend imajını oluştur
        run: |
          docker build \
            --target production \
            --build-arg BUILD_VERSION="0.0.0-ci" \
            --build-arg BUILD_REVISION="${GITHUB_SHA}" \
            --build-arg BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "nutrisense-backend:${GITHUB_SHA}" \
            backend

      - name: Container zafiyet taraması
        # v0.36.0 signed release commit; tag yerine immutable SHA kullanılır.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "nutrisense-backend:${{ github.sha }}"
          version: "v0.70.0"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  staging-smoke:
    name: Sentetik Staging Smoke ve Restore
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: backend-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sentetik runtime secret dosyası oluştur
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          umask 077
          {
            echo "APP_VERSION=0.0.0-ci"
            echo "BUILD_REVISION=${GITHUB_SHA}"
            echo "BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo "DB_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "JWT_SECRET_KEY=$(openssl rand -hex 32)"
            echo "RESEARCH_EXPORT_TOKEN=$(openssl rand -hex 32)"
            echo "OPERATIONS_TOKEN=$(openssl rand -hex 32)"
          } > .runtime/staging.env

      - name: Compose yapılandırmasını doğrula
        working-directory: backend
        run: docker compose --env-file .runtime/staging.env -f compose.staging.yml config --quiet

      - name: Sentetik staging sistemini başlat
        working-directory: backend
        run: docker compose --env-file .runtime/staging.env -f compose.staging.yml up --build --detach --wait

      - name: Health, readiness ve mahremiyet smoke testi
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .runtime/staging.env
          set +a
          export NUTRISENSE_OPERATIONS_TOKEN="${OPERATIONS_TOKEN}"
          python scripts/smoke_staging.py --base-url http://127.0.0.1:8000

      - name: Migration revision kontrolü
        working-directory: backend
        run: docker compose --env-file .runtime/staging.env -f compose.staging.yml exec -T backend python -m scripts.check_migrations

      - name: Sentetik backup/restore bütünlük testi
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .runtime/staging.env -f compose.staging.yml \
            exec -T db sh -s < scripts/backup_restore_smoke.sh

      - name: Compose logları (başarısızlıkta)
        if: failure()
        working-directory: backend
        run: docker compose --env-file .runtime/staging.env -f compose.staging.yml logs --no-color --tail=200

      - name: Sentetik staging sistemini temizle
        if: always()
        working-directory: backend
        run: docker compose --env-file .runtime/staging.env -f compose.staging.yml down --volumes

  deployment-artifact:
    name: Immutable Backend Artefaktı ve SBOM
    runs-on: ubuntu-latest
    needs: [backend-test, security]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Production container artefaktını oluştur
        run: |
          docker build \
            --target production \
            --build-arg BUILD_VERSION="0.0.0-ci" \
            --build-arg BUILD_REVISION="${GITHUB_SHA}" \
            --build-arg BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "nutrisense-backend:${GITHUB_SHA}" \
            backend

      - name: SBOM ve release manifest oluştur
        run: |
          mkdir -p dist/backend
          python backend/scripts/generate_sbom.py \
            --lock backend/requirements.lock \
            --output dist/backend/sbom.cdx.json \
            --version 0.0.0-ci \
            --revision "${GITHUB_SHA}"
          image_id="$(docker image inspect --format '{{.Id}}' "nutrisense-backend:${GITHUB_SHA}")"
          python backend/scripts/generate_release_manifest.py \
            --version 0.0.0-ci \
            --revision "${GITHUB_SHA}" \
            --image-id "${image_id}" \
            --sbom dist/backend/sbom.cdx.json \
            --openapi contracts/openapi.json \
            --output dist/backend/release-manifest.json
          docker save "nutrisense-backend:${GITHUB_SHA}" | gzip -9 > dist/backend/image.tar.gz
          sha256sum dist/backend/image.tar.gz > dist/backend/image.tar.gz.sha256

      - name: İzlenebilir backend artefaktını kaydet
        uses: actions/upload-artifact@v7
        with:
          name: backend-image-${{ github.sha }}
          path: dist/backend/
          if-no-files-found: error
          retention-days: 14

  analysis-test:
    name: Açık Bilim Analiz Hattı
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.ANALYSIS_PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: analysis/requirements.lock

      - name: Kilitli analiz ortamını yükle
        run: python -m pip install --requirement analysis/requirements.lock

      - name: Analiz testlerini çalıştır
        env:
          PYTHONPATH: analysis/src
        run: python -m pytest analysis/tests -q

      - name: Gerçek veri yok kapısını doğrula
        run: |
          python analysis/run_analysis.py \
            --mode real \
            --output-root "$RUNNER_TEMP/real-analysis-output"
          python -c "import json, pathlib; p=json.loads((pathlib.Path('$RUNNER_TEMP')/'results_manifest.json').read_text()); assert p['status']=='NO REAL DATA' and not p['results']"

      - name: Sentetik pipeline smoke testi
        run: |
          python analysis/tools/generate_synthetic_fixture.py \
            --output "$RUNNER_TEMP/synthetic-input"
          python analysis/run_analysis.py \
            --mode synthetic \
            --usability "$RUNNER_TEMP/synthetic-input/usability_tidy.synthetic.json" \
            --survey "$RUNNER_TEMP/synthetic-input/survey_tidy.synthetic.json" \
            --output-root "$RUNNER_TEMP/synthetic-analysis-output"
          python -c "import json, pathlib; p=json.loads((pathlib.Path('$RUNNER_TEMP')/'synthetic-analysis-output'/'synthetic'/'LATEST_STATUS.json').read_text()); assert p['status']=='SYNTHETIC_PIPELINE_TEST_ONLY' and p['synthetic']"

  # ═══════════════════════════════════════════════════════════════════════════
  # ERİŞİLEBİLİRLİK DENETİMİ
  # ═══════════════════════════════════════════════════════════════════════════

  accessibility-audit:
    name: Erişilebilirlik Denetimi
    runs-on: ubuntu-latest
    needs: flutter-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: Erişilebilirlik testi
        run: |
          echo "═══ ERİŞİLEBİLİRLİK DENETİMİ ═══"
          flutter test test/accessibility/ --reporter expanded
          echo "✅ Erişilebilirlik denetimi tamamlandı"

  # ═══════════════════════════════════════════════════════════════════════════
  # iOS DERLEME (yalnız elle tetiklenir; macOS runner 10x dakika harcar)
  # ═══════════════════════════════════════════════════════════════════════════

  ios-build:
    name: iOS Derleme
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      # İmzasız derleme: sertifika/provisioning profili gerektirmez, bu yüzden
      # depoda hiçbir imzalama sırrı tutulmaz. Kaynağın gerçekten Xcode ile
      # derlendiğini kanıtlar; App Store arşivi kanıtlamaz.
      - name: iOS derleme (imzasız)
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --debug --no-codesign \
            --dart-define=APP_ENV=dev \
            --no-tree-shake-icons
          test -d build/ios/iphoneos/Runner.app

      - name: Derlenen uygulamanın kimliğini doğrula
        shell: bash
        run: |
          set -euo pipefail
          plist=build/ios/iphoneos/Runner.app/Info.plist
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist")
          echo "CFBundleIdentifier=$bundle_id"
          test -n "$bundle_id"

  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD KONTROLÜ (sadece main)
  # ═══════════════════════════════════════════════════════════════════════════

  build-check:
    name: Build Kontrolü
    runs-on: ubuntu-latest
    needs: [flutter-test, backend-test, android-integration, ml-validation, analysis-test, security, staging-smoke, deployment-artifact]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: APK build kontrolü
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --flavor dev \
            --dart-define=APP_ENV=dev \
            --no-tree-shake-icons 2>&1 | tee "$RUNNER_TEMP/flutter-build.log"
          test -s build/app/outputs/flutter-apk/app-dev-debug.apk

      - name: Debug APK artefaktını kaydet
        uses: actions/upload-artifact@v7
        with:
          name: nutrisense-debug-apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 7
